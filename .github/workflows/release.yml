name: Release

run-name: Release ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  validate:
    name: validate and build
    runs-on: cpu-micro-amd64-onprem
    timeout-minutes: 25
    outputs:
      package_name: ${{ steps.metadata.outputs.package_name }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a tag reachable from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Select a release tag when dispatching this workflow." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The selected tag is not reachable from main." >&2
            exit 1
          fi
          tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          if [ "$(jq -r '.object.type' <<<"$tag_ref")" != "tag" ]; then
            echo "The selected tag must be signed and annotated, not lightweight." >&2
            exit 1
          fi
          tag_sha=$(jq -r '.object.sha' <<<"$tag_ref")
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.verification.verified')" != "true" ]; then
            echo "GitHub could not verify the selected tag signature." >&2
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/setup@bf5bfae7d43e2b2b1191383f5005cd3fb69b848d # v2.0.2
        with:
          cache: false
          install: false

      - name: Install Node.js and npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release metadata
        id: metadata
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const changelog = readFileSync("CHANGELOG.md", "utf8");
          const version = pkg.version;
          const releaseVersion = /^\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?$/;

          if (pkg.private === true) throw new Error('Remove "private": true before releasing.');
          if (pkg.publishConfig?.access !== "public") {
            throw new Error('Set publishConfig.access to "public" before releasing.');
          }
          if (pkg.publishConfig?.registry !== "https://registry.npmjs.org/") {
            throw new Error('Set publishConfig.registry to "https://registry.npmjs.org/" before releasing.');
          }
          if (!releaseVersion.test(version)) throw new Error(`Not a release version: ${version}`);
          if (process.env.TAG_NAME !== `v${version}`) {
            throw new Error(`Tag ${process.env.TAG_NAME} does not match package version ${version}.`);
          }
          if (!changelog.includes(`## [${version}]`) && !changelog.includes(`## [v${version}]`)) {
            throw new Error(`CHANGELOG.md has no section for ${version}.`);
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `package_name=${pkg.name}\nversion=${version}\n`);
          NODE

      - name: Run release checks
        run: pnpm release:check

      - name: Build release artifact
        run: pnpm pack:artifact

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish to npm
    needs: validate
    runs-on: cpu-micro-amd64-onprem
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing through GitHub OIDC.
    steps:
      - name: Checkout selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install OIDC-capable npm
        run: >- # zizmor: ignore[adhoc-packages] Trusted publishing requires npm 11.5.1+; use one exact, script-free version.
          npm install --global npm@12.0.2 --ignore-scripts

      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifacts

      - name: Verify release artifact
        run: (cd artifacts && sha256sum --check ./*.sha256)

      - name: Publish exact artifact
        env:
          PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -- ./artifacts/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one package tarball." >&2
            exit 1
          fi
          if published_url_json=$(npm view "$PACKAGE_NAME@$VERSION" dist.tarball --json 2>/dev/null); then
            published_url=$(printf '%s' "$published_url_json" | jq -r 'if type == "string" then . else empty end')
            if [ -z "$published_url" ]; then
              echo "The package version exists but has no tarball URL." >&2
              exit 1
            fi
            curl -fsSL "$published_url" -o "$RUNNER_TEMP/published.tgz"
            expected_sha=$(sha256sum "$1" | awk '{print $1}')
            published_sha=$(sha256sum "$RUNNER_TEMP/published.tgz" | awk '{print $1}')
            if [ "$expected_sha" != "$published_sha" ]; then
              echo "The published package does not match the release artifact." >&2
              exit 1
            fi
            echo "$PACKAGE_NAME@$VERSION is already published with the expected digest."
          else
            npm publish "$1" --access public
          fi

  github-release:
    name: create GitHub release
    needs:
      - validate
      - publish
    runs-on: cpu-micro-amd64-onprem
    timeout-minutes: 10
    permissions:
      contents: write # Required to create and update this repository's GitHub release.
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" ./artifacts/* --clobber
            gh release edit "$TAG_NAME" --title "v$VERSION"
          else
            gh release create "$TAG_NAME" ./artifacts/* --verify-tag --title "v$VERSION" --generate-notes
          fi
