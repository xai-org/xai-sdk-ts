name: Secret Scan

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "53 12 * * 2"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks/history
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan history and current files
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          docker run --rm \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            "$GITLEAKS_IMAGE" \
            dir /repo --config /repo/.gitleaks.toml --redact --no-banner
