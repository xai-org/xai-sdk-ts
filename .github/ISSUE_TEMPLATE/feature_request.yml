name: Feature request
description: Suggest an improvement to the SpaceXAI TypeScript SDK
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form for SDK client features. Contact SpaceXAI support for new model capabilities or server-side API changes.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: This request concerns the TypeScript SDK rather than a new model capability or server-side API change.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What SDK use case is difficult today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API and behavior you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and additional context
      description: Describe workarounds, compatibility concerns, or related SDKs.
